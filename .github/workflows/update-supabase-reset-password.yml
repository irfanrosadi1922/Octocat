name: Update Supabase Reset Password Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Update Supabase password recovery email template
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: txnpqiiwdtgtfgkrquty
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]

          html = """<!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Atur Ulang Password Ordela</title>
          </head>
          <body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222222;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f5f5;padding:40px 15px;">
              <tr><td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;">
                  <tr><td align="center" style="padding:35px 30px 20px;">
                    <div style="font-size:30px;font-weight:800;letter-spacing:-1px;color:#171717;"><span style="color:#e53935;">O</span>rdela</div>
                  </td></tr>
                  <tr><td style="padding:20px 35px 35px;text-align:center;">
                    <h1 style="font-size:24px;line-height:1.3;margin:0 0 16px;color:#171717;">Atur Ulang Password</h1>
                    <p style="font-size:15px;line-height:1.7;color:#666666;margin:0 0 25px;">Kami menerima permintaan untuk mengatur ulang password akun Ordela kamu. Tekan tombol di bawah ini untuk membuat password baru.</p>
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center"><tr><td align="center" style="background:#e53935;border-radius:7px;">
                      <a href="{{ .SiteURL }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:15px 32px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;">Atur Ulang Password</a>
                    </td></tr></table>
                    <p style="font-size:13px;line-height:1.6;color:#888888;margin:25px 0 8px;">Jika tombol tidak berfungsi, salin dan buka tautan berikut melalui browser:</p>
                    <p style="font-size:12px;line-height:1.6;word-break:break-all;margin:0;"><a href="{{ .SiteURL }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="color:#e53935;text-decoration:underline;">{{ .SiteURL }}?token_hash={{ .TokenHash }}&amp;type=recovery</a></p>
                    <p style="font-size:13px;line-height:1.6;color:#888888;margin:25px 0 0;">Jika kamu tidak meminta perubahan password, abaikan email ini. Password kamu tidak akan berubah sampai kamu menyelesaikan proses pengaturan ulang.</p>
                  </td></tr>
                  <tr><td align="center" style="background:#fafafa;padding:22px 25px;border-top:1px solid #eeeeee;">
                    <p style="font-size:12px;color:#999999;margin:0 0 6px;">© 2026 Ordela. All rights reserved.</p>
                    <p style="font-size:12px;color:#999999;margin:0;">Email ini dikirim secara otomatis. Mohon jangan membalas.</p>
                  </td></tr>
                </table>
              </td></tr>
            </table>
          </body>
          </html>"""

          payload = {
              "mailer_otp_exp": 86400,
              "mailer_subjects_recovery": "Atur Ulang Password Akun Ordela",
              "mailer_templates_recovery_content": html
          }

          url = f"https://api.supabase.com/v1/projects/{project_ref}/config/auth"
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "Ordela-GitHub-Actions"
              },
              method="PATCH"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Supabase API update succeeded (HTTP {response.status}).")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")
              print(f"Supabase API update failed (HTTP {error.code}): {detail}")
              raise
          PY
